# A workspace of one crate so every path is relative to this root: Cargo hashes paths
# outside a workspace root into symbol names, which would make the WebAssembly's bytes
# depend on where the checkout lives.
[workspace]
members = ["crates/fast-docx-text"]
resolver = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
